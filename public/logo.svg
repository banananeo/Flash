<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="FLASH! logo">
  <title>FLASH! — F! monogram</title>
  <!-- Master logo: F! monogram, brutal yellow (#FFDE59) on black.
       The "!" stem is a lightning bolt; dot is a brutalist square.
       Pure geometry (rects + one polygon) so SVG and exported PNGs match pixel-for-pixel. -->
  <rect width="512" height="512" fill="#000000"/>
  <g fill="#FFDE59">
    <!-- F: stem + top arm + mid arm -->
    <rect x="104" y="116" width="76" height="280"/>
    <rect x="104" y="116" width="244" height="72"/>
    <rect x="104" y="244" width="204" height="64"/>
    <!-- ! stem: lightning bolt -->
    <polygon points="396,116 328,258 366,258 342,396 428,238 386,238 412,116"/>
    <!-- ! dot -->
    <rect x="346" y="412" width="60" height="56"/>
  </g>
</svg>

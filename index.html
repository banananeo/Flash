    <title>FLASH! — News + Live Scores</title>
    <script>
      // Theme boot guard: apply saved/system theme before first paint (no FOUC).
      // Mirrors src/store/useThemeStore.js initialTheme().
      try {
        var t = localStorage.getItem('flash-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (t === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) { /* ignore */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
